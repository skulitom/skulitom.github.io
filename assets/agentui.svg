<g font-family="Segoe UI,Arial,sans-serif">
<text x="42" y="51" fill="#a7f3d0" font-size="16" letter-spacing="2">AGENTUI / HUMAN–AGENT INTERACTION</text>
<rect x="42" y="87" width="324" height="209" rx="14" fill="#10151f" stroke="#647388"/>
<rect x="434" y="87" width="324" height="209" rx="14" fill="#10151f" stroke="#9984dc"/>
