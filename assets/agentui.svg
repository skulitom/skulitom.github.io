<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">AgentUI / Human–agent interaction</title><desc id="desc">Interaction diagram: an agent opens controls, a person adjusts them, and the response is returned as structured state.</desc>
