<rect width="800" height="400" rx="20" fill="url(#bg)"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="42" y="51" fill="#a7f3d0" font-size="16" letter-spacing="2">ANODE / WINDOWS CHILD SESSION</text>
<rect x="42" y="87" width="324" height="209" rx="14" fill="#10151f" stroke="#647388"/>
<rect x="434" y="87" width="324" height="209" rx="14" fill="#10151f" stroke="#9984dc"/>
<text x="65" y="130" fill="#f0f1f6" font-size="24" font-weight="600">Your desktop</text>
<text x="457" y="130" fill="#f0f1f6" font-size="24" font-weight="600">Agent seat</text>
<text x="65" y="177" fill="#b9c3d3" font-size="21">Your pointer</text><text x="65" y="212" fill="#b9c3d3" font-size="21">Your keyboard focus</text><text x="65" y="247" fill="#b9c3d3" font-size="21">Your open applications</text>
<text x="457" y="177" fill="#b9c3d3" font-size="21">Separate pointer &amp; focus</text><text x="457" y="212" fill="#b9c3d3" font-size="21">CLI &amp; MCP controls</text><text x="457" y="247" fill="#b9c3d3" font-size="21">Virtual gamepad</text>
