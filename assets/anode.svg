<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Anode / Windows child session</title><desc id="desc">Architecture diagram showing a personal desktop and a separate child session for an agent, running as the same user.</desc>
